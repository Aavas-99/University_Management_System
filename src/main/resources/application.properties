
spring.application.name=university-management

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/university_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Default admin configuration
app.admin.name=${ADMIN_NAME:University Admin}
app.admin.email=${ADMIN_EMAIL:admin@uni.com}
app.admin.password=${ADMIN_PASSWORD}
